<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde Ficar em Maués — Guia de Hospedagem</title>
    <meta name="description" content="Pousadas, hotéis, hostels e barco-hotéis em Maués. Filtros por faixa de preço e tipo. Reserve direto pelo WhatsApp.">
    <meta property="og:title" content="Onde Ficar em Maués">
    <meta property="og:description" content="De pousadas rústicas à beira-rio a hotéis confortáveis. Opções para todos os bolsos.">
    <meta property="og:image" content="https://picsum.photos/seed/hotel-amazon-river-view/1200/630.jpg">
    <meta property="og:type" content="website">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B4F26">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/tailwind.config.js"></script>
</head>
<body>
    <div class="toast" id="toast"></div>
    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Voltar ao topo"><iconify-icon icon="lucide:arrow-up" class="text-lg"></iconify-icon></button>
    <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500" id="navbar"></header>
    <div class="mobile-menu fixed inset-0 z-40 bg-amazon/98 backdrop-blur-xl xl:hidden" id="mobileMenu"></div>

    <div class="page-hero">
        <img src="https://picsum.photos/seed/hotel-amazon-river-view/1920/600.jpg" alt="Hospedagem em Maués" class="page-hero-bg">
        <div class="absolute inset-0 bg-gradient-to-r from-amazon-dark/95 via-amazon/80 to-amazon/40"></div>
        <div class="page-hero-content">
            <span class="inline-block text-sol text-xs font-heading font-bold uppercase tracking-[0.3em] mb-4">Guia de Hospedagem</span>
            <h1 class="font-heading font-black text-3xl md:text-5xl lg:text-6xl text-white tracking-tight leading-[1] mb-4">Onde Ficar<br>em Maués</h1>
            <p class="text-white/70 text-base max-w-xl font-body font-light leading-relaxed">De pousadas rústicas à beira-rio a hotéis confortáveis. Opções para todos os bolsos.</p>
        </div>
    </div>

    <section class="py-16 bg-areia">
        <div class="max-w-[1400px] mx-auto px-4 md:px-8">
            <!-- Filtros por preço -->
            <div class="flex flex-wrap gap-3 mb-6 reveal">
                <button class="filter-btn active font-heading font-semibold text-xs uppercase tracking-wider px-5 py-2.5 rounded-full border border-amazon/20" onclick="filterLodging('all','tier',this)">Todas</button>
                <button class="filter-btn font-heading font-semibold text-xs uppercase tracking-wider px-5 py-2.5 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('eco','tier',this)">Econômico (até R$120)</button>
                <button class="filter-btn font-heading font-semibold text-xs uppercase tracking-wider px-5 py-2.5 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('medio','tier',this)">Intermediário (R$120-250)</button>
                <button class="filter-btn font-heading font-semibold text-xs uppercase tracking-wider px-5 py-2.5 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('alto','tier',this)">Superior (R$250+)</button>
            </div>
            <!-- Filtros por tipo -->
            <div class="flex flex-wrap gap-3 mb-10 reveal">
                <button class="type-btn active font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('all','tipo',this)">Todos os tipos</button>
                <button class="type-btn font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('Pousada','tipo',this)">Pousada</button>
                <button class="type-btn font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('Hostel','tipo',this)">Hostel</button>
                <button class="type-btn font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('Hotel','tipo',this)">Hotel</button>
                <button class="type-btn font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('Chalé','tipo',this)">Chalé</button>
                <button class="type-btn font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('Barco-hotel','tipo',this)">Barco-hotel</button>
                <button class="type-btn font-heading font-semibold text-xs uppercase tracking-wider px-4 py-2 rounded-full border border-amazon/20 bg-areia text-amazon-dark" onclick="filterLodging('Comunitário','tipo',this)">Comunitário</button>
            </div>
            <!-- Grid dinâmico -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="lodgingGrid"></div>
        </div>
    </section>

    <footer id="siteFooter"></footer>
    <script src="js/nav-data.js"></script>
    <script src="js/search.js"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/app.js"></script>
    <script>
        let lodgings = [];
        let activeTier = 'all';
        let activeTipo = 'all';

        async function loadLodgings() {
            try {
                const res = await fetch('data/hospedagens.json');
                lodgings = await res.json();
            } catch { lodgings = []; }
            renderLodgings();
        }

        function renderLodgings() {
            const grid = document.getElementById('lodgingGrid');
            if (!grid) return;
            const filtered = lodgings.filter(h => {
                const tierMatch = activeTier === 'all' || h.tier === activeTier;
                const tipoMatch = activeTipo === 'all' || h.tipo === activeTipo;
                return tierMatch && tipoMatch;
            });

            if (!filtered.length) {
                grid.innerHTML = '<div class="col-span-full text-center py-16"><iconify-icon icon="lucide:search-x" class="text-areia-dark/20 text-5xl mb-4 block mx-auto"></iconify-icon><p class="text-gray-400 font-body">Nenhuma hospedagem encontrada com esses filtros.</p></div>';
                return;
            }

            const tierLabels = { eco: 'Econômico', medio: 'Intermediário', alto: 'Superior' };
            const tierColors = { eco: 'amazon', medio: 'sol', alto: 'guarana' };

            grid.innerHTML = filtered.map((h, i) => `
                <div class="info-card lodging-card" style="opacity:0;transform:translateY(20px);transition:all .5s cubic-bezier(.16,1,.3,1) ${i*0.06}s">
                    <div class="rounded-xl overflow-hidden h-44 mb-4"><img src="${h.img}" alt="${h.nome}" class="w-full h-full object-cover" loading="lazy"></div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-heading font-bold text-amazon-dark">${h.nome}</h3>
                        <span class="bg-${tierColors[h.tier]}/10 text-${tierColors[h.tier]} text-[10px] font-heading font-bold uppercase px-2 py-1 rounded-full">${tierLabels[h.tier]}</span>
                    </div>
                    <span class="bg-amazon/5 text-amazon-dark/60 text-[10px] font-heading font-semibold uppercase px-2 py-0.5 rounded inline-block mb-3">${h.tipo}</span>
                    <p class="text-gray-500 text-sm font-body mb-4">${h.desc}</p>
                    <div class="flex items-center justify-between mb-4">
                        <span class="price-badge">R$ ${h.preco} / noite</span>
                        <div class="flex items-center gap-1 text-sol text-xs"><iconify-icon icon="lucide:star" class="text-sm"></iconify-icon> ${h.avaliacao}</div>
                    </div>
                    <a href="https://wa.me/55${h.whatsapp}?text=Olá! Vi o site Turismo Maués e gostaria de saber sobre disponibilidade na ${encodeURIComponent(h.nome)}." target="_blank" rel="noopener" class="whatsapp-btn w-full justify-center">
                        <iconify-icon icon="lucide:message-circle" class="text-sm"></iconify-icon> Reservar via WhatsApp
                    </a>
                </div>
            `).join('');

            // Animar entrada
            requestAnimationFrame(() => {
                grid.querySelectorAll('.lodging-card').forEach(c => { c.style.opacity='1'; c.style.transform='translateY(0)'; });
            });
        }

        function filterLodging(value, type, btn) {
            if (type === 'tier') {
                activeTier = value;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            } else {
                activeTipo = value;
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            }
            btn.classList.add('active');
            renderLodgings();
        }

        loadLodgings();
    </script>
</body>
</html>
