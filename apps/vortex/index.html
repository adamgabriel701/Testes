<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vórtex — Laboratório de UI Generativa</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/vortex.css">
</head>
<body>

  <!-- Canvas principal -->
  <canvas id="mainCanvas"></canvas>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">VORTEX</span>
      <span class="logo-sub">UI Lab</span>
    </div>
    <div class="topbar-right">
      <span class="stat" id="statFps">60 FPS</span>
      <span class="stat" id="statNodes">0 nós</span>
      <span class="stat" id="statEdges">0 ligações</span>
    </div>
  </header>

  <!-- Painel de controles -->
  <aside class="panel" id="panel">
    <div class="panel-header">
      <h2>Parâmetros</h2>
      <button class="panel-toggle" id="panelToggle" aria-label="Recolher painel">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    </div>

    <div class="panel-body" id="panelBody">
      <!-- Presets -->
      <section class="control-group">
        <h3 class="group-title">Presets</h3>
        <div class="preset-grid">
          <button class="preset-btn active" data-preset="constellation">Constelação</button>
          <button class="preset-btn" data-preset="mesh">Malha</button>
          <button class="preset-btn" data-preset="orbit">Órbita</button>
          <button class="preset-btn" data-preset="swarm">Enxame</button>
          <button class="preset-btn" data-preset="crystal">Cristal</button>
          <button class="preset-btn" data-preset="waves">Ondas</button>
        </div>
      </section>

      <!-- Física -->
      <section class="control-group">
        <h3 class="group-title">Física</h3>
        <div class="slider-row">
          <label>Nós</label>
          <input type="range" class="vortex-slider" id="nodeCount" min="5" max="200" value="60">
          <span class="slider-val" id="nodeCountVal">60</span>
        </div>
        <div class="slider-row">
          <label>Repulsão</label>
          <input type="range" class="vortex-slider" id="repulsion" min="500" max="8000" value="3000">
          <span class="slider-val" id="repulsionVal">3000</span>
        </div>
        <div class="slider-row">
          <label>Conexão</label>
          <input type="range" class="vortex-slider" id="linkDistance" min="40" max="300" value="120">
          <span class="slider-val" id="linkDistanceVal">120</span>
        </div>
        <div class="slider-row">
          <label>Velocidade</label>
          <input type="range" class="vortex-slider" id="speed" min="0" max="100" value="30">
          <span class="slider-val" id="speedVal">30</span>
        </div>
        <div class="slider-row">
          <label>Damping</label>
          <input type="range" class="vortex-slider" id="damping" min="80" max="99" value="95">
          <span class="slider-val" id="dampingVal">95</span>
        </div>
      </section>

      <!-- Visual -->
      <section class="control-group">
        <h3 class="group-title">Visual</h3>
        <div class="slider-row">
          <label>Tamanho do nó</label>
          <input type="range" class="vortex-slider" id="nodeSize" min="1" max="12" value="3">
          <span class="slider-val" id="nodeSizeVal">3</span>
        </div>
        <div class="slider-row">
          <label>Opacidade da linha</label>
          <input type="range" class="vortex-slider" id="lineOpacity" min="5" max="100" value="40">
          <span class="slider-val" id="lineOpacityVal">40</span>
        </div>
        <div class="color-row">
          <label>Cor A</label>
          <input type="color" id="colorA" value="#ff6b35">
          <label>Cor B</label>
          <input type="color" id="colorB" value="#00d4aa">
        </div>
        <div class="toggle-row">
          <label>Glow</label>
          <button class="toggle-btn active" id="toggleGlow" aria-label="Alternar glow"></button>
        </div>
        <div class="toggle-row">
          <label>Trilhas</label>
          <button class="toggle-btn active" id="toggleTrails" aria-label="Alternar trilhas"></button>
        </div>
      </section>

      <!-- Ações -->
      <section class="control-group">
        <h3 class="group-title">Ações</h3>
        <div class="action-grid">
          <button class="action-btn" id="btnExplode"><i class="fa-solid fa-explosion"></i> Explosão</button>
          <button class="action-btn" id="btnImplode"><i class="fa-solid fa-compress"></i> Implosão</button>
          <button class="action-btn" id="btnFreeze"><i class="fa-solid fa-snowflake"></i> Congelar</button>
          <button class="action-btn" id="btnScatter"><i class="fa-solid fa-arrows-up-down-left-right"></i> Espalhar</button>
          <button class="action-btn accent" id="btnExportSVG"><i class="fa-solid fa-code"></i> SVG</button>
          <button class="action-btn accent" id="btnExportCanvas"><i class="fa-solid fa-image"></i> PNG</button>
        </div>
      </section>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/vortex.js"></script>
</body>
</html>
